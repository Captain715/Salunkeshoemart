<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Salunke Shoe Mart</title><link rel="stylesheet" href="css/style.css"></head><body><header id="site-header"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">THE FULL COLLECTION</p><h1>Shop all footwear</h1><p>Search the catalogue and find your next pair.</p></div></section><section class="section"><div class="container"><div class="shop-tools"><input id="search" placeholder="Search shoes, sandals, brands…"><select id="sort" style="max-width:190px"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="filters" id="filters"></div><div class="product-grid" id="products"><div class="empty-state">Loading collection…</div></div></div></section></main><footer id="site-footer"></footer><script type="module" src="js/store.js"></script><script type="module">import{products,card}from"./js/store.js";import{supabase}from"./js/db.js";const grid=document.querySelector("#products"),filters=document.querySelector("#filters"),search=document.querySelector("#search"),sort=document.querySelector("#sort");let cat="";async function load(){grid.innerHTML='<div class="empty-state">Loading…</div>';try{let p=await products({category:cat,search:search.value});if(sort.value==="low")p.sort((a,b)=>a.price-b.price);if(sort.value==="high")p.sort((a,b)=>b.price-a.price);grid.innerHTML=p.length?p.map(card).join(""):'<div class="empty-state"><h3>No products found</h3><p>Try another search or contact the store for availability.</p></div>'}catch(e){grid.innerHTML='<div class="empty-state">Could not load catalogue. Please refresh.</div>'}}try{const r=await supabase.from("categories").select("id,name").eq("is_active",true).order("sort_order");filters.innerHTML='<button class="chip active" data-id="">ALL</button>'+(r.data||[]).map(c=>'<button class="chip" data-id="'+c.id+'">'+c.name.toUpperCase()+'</button>').join("")}catch(e){}filters.onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;cat=b.dataset.id;filters.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));load()};search.oninput=()=>{clearTimeout(window.st);window.st=setTimeout(load,250)};sort.onchange=load;load();</script></body></html>
