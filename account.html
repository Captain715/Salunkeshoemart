<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Salunke Shoe Mart</title><link rel="stylesheet" href="css/style.css"></head><body><header id="site-header"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>Welcome back.</h1><p>Sign in or create a customer account.</p></div></section><section class="section"><div class="container"><div id="status"></div><div class="auth-grid" id="forms"><div class="panel"><h2>Sign in</h2><form id="login"><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="field"><label>PASSWORD</label><input name="password" type="password" required></div><button class="btn btn-dark">SIGN IN</button></form></div><div class="panel"><h2>Create account</h2><form id="signup"><div class="field"><label>FULL NAME</label><input name="name" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="field"><label>PASSWORD (8+ CHARACTERS)</label><input name="password" type="password" minlength="8" required></div><button class="btn">CREATE ACCOUNT</button></form></div></div></div></section></main><footer id="site-footer"></footer><script type="module" src="js/store.js"></script><script type="module" src="js/account.js"></script></body></html>
